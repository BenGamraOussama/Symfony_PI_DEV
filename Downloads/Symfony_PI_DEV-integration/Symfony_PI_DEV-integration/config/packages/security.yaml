security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\SecurityAuthenticator
            entry_point: form_login # Définir form_login comme point d'entrée
            logout:
                path: app_logout
                target: app_home # Redirection après déconnexion, vers la page d'accueil

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true

            # Formulaire de login
            form_login:
                login_path: app_login
                check_path: app_login_check
                default_target_path: app_home # Redirection après connexion réussie vers la page d'accueil

            # Si vous souhaitez activer le switch_user (changement d'utilisateur pour un admin par exemple)
            # switch_user: true

    # Contrôle des accès par rôles
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/patient, roles: ROLE_PATIENT }
        - { path: ^/psychiatre, roles: ROLE_PSYCHIATRE }
        - { path: ^/fournisseur, roles: ROLE_FOURNISSEUR }
        - { path: ^/produit, roles: ROLE_FOURNISSEUR } # Ajouter accès aux produits pour fournisseur
        - { path: ^/commande, roles: ROLE_PATIENT } # Ajouter accès aux commandes pour patients

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Plus faible pour les tests
                time_cost: 3
                memory_cost: 10
